services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      VOID_DOMAIN: ${VOID_DOMAIN:?Set your domain pointing to this server}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      void:
        condition: service_healthy
volumes:
  caddy-data:
  caddy-config:
