<html><body><script src='https://js.puter.com/v2/'></script><script>window.onload = async () => { try { const img = await puter.ai.txt2img('A cat', true); console.log('Success:', img.src); document.body.innerHTML += '<p id="res">Success: ' + img.src + '</p>'; } catch (e) { console.error(e); document.body.innerHTML += '<p id="err">Error: ' + JSON.stringify(Object.getOwnPropertyNames(e)) + ' ' + String(e) + '</p>'; } };</script></body></html>
